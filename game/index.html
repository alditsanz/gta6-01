<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b1020;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: #0b1020;
    cursor: crosshair;
  }
</style>
</head>

<div id="wrap">

</div>
