  html, body {

<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>

    R reload · F punch · Space handbrake · T taxi fare · G turf war · B delivery ·
    Shift sprint · P pause · M mute · Enter mission board

</div>
